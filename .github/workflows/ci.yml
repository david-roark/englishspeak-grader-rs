name: CI (Lint, Format, Typecheck & Tests)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-and-ui-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install FFmpeg (ffmpeg-static b6.1.1, match release sidecar)
        run: |
          curl -fsSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz" -o ffmpeg.gz
          echo "bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz" | sha256sum -c -
          gzip -dc ffmpeg.gz | sudo tee /usr/local/bin/ffmpeg >/dev/null
          sudo chmod +x /usr/local/bin/ffmpeg
          rm -f ffmpeg.gz
          ffmpeg -version

      - name: Install Rust stable (with clippy & rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy (-D warnings)
        run: |
          cargo clippy --manifest-path Cargo.toml -p grader-core --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests (grader-core & src-tauri)
        run: |
          cargo test --manifest-path Cargo.toml --workspace
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install & verify UI (typecheck, lint, test, build)
        run: |
          npm --prefix ui ci
          npm --prefix ui run check
