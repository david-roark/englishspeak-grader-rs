[package]
name = "englishspeak-grader-app"
version = "0.3.0"
description = "App AI (Gemini) hỗ trợ giáo viên tiếng Anh chấm bài nói qua video"
authors = ["EnglishSpeak Grader Contributors"]
edition = "2021"

[lib]
name = "englishspeak_grader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grader-core = { path = "../crates/grader-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
