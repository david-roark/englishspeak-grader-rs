name: Build & Release Cross-Platform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri system libraries & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            ffmpeg

      - name: Install Rust stable (with clippy & rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check formatting & Clippy
        run: |
          cargo fmt --manifest-path Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path Cargo.toml -p grader-core --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: |
          cargo test -p grader-core
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify UI (typecheck, lint, test, build)
        run: |
          npm --prefix ui ci
          npm --prefix ui run check

  build-tauri:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--config src-tauri/tauri.sidecar.conf.json"
            ffmpeg_asset: ffmpeg-linux-x64.gz
            ffmpeg_sha256: bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
            ffmpeg_bin: ffmpeg-x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--config src-tauri/tauri.sidecar.conf.json"
            ffmpeg_asset: ffmpeg-win32-x64.gz
            ffmpeg_sha256: 8883a3dffbd0a16cf4ef95206ea05283f78908dbfb118f73c83f4951dcc06d77
            ffmpeg_bin: ffmpeg-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--config src-tauri/tauri.sidecar.conf.json --target aarch64-apple-darwin"
            ffmpeg_asset: ffmpeg-darwin-arm64.gz
            ffmpeg_sha256: 8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa
            ffmpeg_bin: ffmpeg-aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--config src-tauri/tauri.sidecar.conf.json --target x86_64-apple-darwin"
            ffmpeg_asset: ffmpeg-darwin-x64.gz
            ffmpeg_sha256: 929b375c1182d956c51f7ac25e0b2b0411fb01f6f407aa15c9758efeb4242106
            ffmpeg_bin: ffmpeg-x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Download & verify FFmpeg sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -fsSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/${{ matrix.ffmpeg_asset }}" -o ffmpeg.gz
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum ffmpeg.gz | awk '{print $1}')
          else
            ACTUAL=$(shasum -a 256 ffmpeg.gz | awk '{print $1}')
          fi
          if [ "$ACTUAL" != "${{ matrix.ffmpeg_sha256 }}" ]; then
            echo "SHA256 mismatch for ${{ matrix.ffmpeg_asset }}: expected ${{ matrix.ffmpeg_sha256 }}, got $ACTUAL" >&2
            exit 1
          fi
          gzip -dc ffmpeg.gz > "src-tauri/binaries/${{ matrix.ffmpeg_bin }}"
          chmod +x "src-tauri/binaries/${{ matrix.ffmpeg_bin }}"
          rm -f ffmpeg.gz

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "EnglishSpeak Grader v__VERSION__"
          releaseBody: "Bản phát hành đa nền tảng (Windows / macOS / Linux)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
